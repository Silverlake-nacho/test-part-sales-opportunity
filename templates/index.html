<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test Silverlake Part Sales Opportunity Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container mt-4">
      <!-- Button trigger modal -->
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ebayModal" onclick="loadEbayContent('under50')">
        View eBay Parts
      </button>

      <!-- Modal -->
      <div class="modal fade" id="ebayModal" tabindex="-1" aria-labelledby="ebayModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="ebayModalLabel">eBay Small Parts</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <ul class="nav nav-tabs" id="ebayTab" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="under50-tab" data-bs-toggle="tab" data-bs-target="#under50" type="button" role="tab" onclick="loadEbayContent('under50')">Under £50</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="fifty500-tab" data-bs-toggle="tab" data-bs-target="#fifty500" type="button" role="tab" onclick="loadEbayContent('fifty500')">£50 to £500</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="over500-tab" data-bs-toggle="tab" data-bs-target="#over500" type="button" role="tab" onclick="loadEbayContent('over500')">Over £500</button>
                </li>
              </ul>
              <div class="tab-content mt-3">
                <div class="tab-pane fade show active" id="under50" role="tabpanel"></div>
                <div class="tab-pane fade" id="fifty500" role="tabpanel"></div>
                <div class="tab-pane fade" id="over500" role="tabpanel"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function loadEbayContent(rangeType) {
        const model = $('input[name="model"]').val();
        const year = $('input[name="year"]').val();
        if (!model || !year) return;

        const tabSelector = `#${rangeType}`;
        $(tabSelector).html('<p>Loading...</p>');

        $.get(`/ebay_small_parts?model=${model}&year=${year}&range=${rangeType}`, function (data) {
          $(tabSelector).html(data);
        }).fail(function () {
          $(tabSelector).html('<p>Error loading data.</p>');
        });
      }
    </script>
  </body>
</html>
